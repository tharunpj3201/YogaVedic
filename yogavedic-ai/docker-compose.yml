version: '3.9'

services:
  mongo:
    image: mongo:7.0
    container_name: yogavedic-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: yogavedic
    # Published on the host's loopback interface only, so the database is NOT reachable from other
    # machines on your network. The backend container reaches it internally as mongo:27017.
    ports:
      - '127.0.0.1:27017:27017'
    volumes:
      - mongo-data:/data/db

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: yogavedic-backend
    restart: unless-stopped
    environment:
      PORT: 4000
      MONGO_URI: mongodb://mongo:27017/yogavedic
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set to a random string of at least 32 characters. See README (Configuration) and backend/.env.example}
      FRONTEND_URL: http://localhost:5173
      NODE_ENV: production
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    ports:
      - '4000:4000'
    depends_on:
      - mongo

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: yogavedic-frontend
    restart: unless-stopped
    ports:
      - '80:80'
    depends_on:
      - backend

volumes:
  mongo-data:
