openapi: 3.0.3
info:
  title: YogaVedic API
  description: |
    REST API for the YogaVedic wellness platform.
    All protected endpoints require a Bearer JWT in the Authorization header.
    JWT is obtained from /api/auth/login or /api/auth/register.
  version: 1.0.0
  contact:
    name: YogaVedic
servers:
  - url: http://localhost:4000
    description: Local development
  - url: https://api.yogavedic.ai
    description: Production

tags:
  - name: Auth
    description: Registration, login, token verification
  - name: Users
    description: Profile management, leaderboard
  - name: Sessions
    description: Session logging and history
  - name: Routines
    description: Saved routine management

paths:

  /health:
    get:
      summary: Health check
      responses:
        "200":
          description: API is healthy
          content:
            application/json:
              example:
                status: ok
                service: YogaVedic API
                version: 1.0.0

  /api/auth/register:
    post:
      tags: [Auth]
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password]
              properties:
                name:
                  type: string
                  example: Shivakumar Rao
                email:
                  type: string
                  format: email
                  example: user@example.com
                password:
                  type: string
                  minLength: 8
                  example: <your-password>
                profile:
                  type: object
                  properties:
                    age: { type: integer, example: 22 }
                    gender: { type: string, enum: [male, female, other], example: male }
                    weight: { type: number, example: 68 }
                    height: { type: number, example: 172 }
                    fitnessLevel: { type: string, enum: [beginner, intermediate, advanced] }
                    conditions: { type: array, items: { type: string } }
                    goal: { type: string }
      responses:
        "201":
          description: User created successfully
          content:
            application/json:
              example:
                token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                user:
                  _id: 60a7b2c3d4e5f6a7b8c9d0e1
                  name: Shivakumar Rao
                  email: user@example.com
                  role: user
                  createdAt: "2026-06-22T10:00:00Z"
        "409":
          description: Email already registered
          content:
            application/json:
              example:
                error: An account with this email already exists.

  /api/auth/login:
    post:
      tags: [Auth]
      summary: Login and receive JWT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  example: user@example.com
                password:
                  type: string
                  example: <your-password>
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              example:
                token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                user:
                  _id: 60a7b2c3d4e5f6a7b8c9d0e1
                  name: Shivakumar Rao
                  email: user@example.com
        "401":
          description: Invalid credentials
          content:
            application/json:
              example:
                error: Invalid email or password.

  /api/auth/me:
    get:
      tags: [Auth]
      summary: Get current authenticated user
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current user
          content:
            application/json:
              example:
                user:
                  _id: 60a7b2c3d4e5f6a7b8c9d0e1
                  name: Shivakumar Rao
                  email: user@example.com
                  profile:
                    age: 22
                    fitnessLevel: beginner
                    conditions: ["Back Pain", "Stress / Anxiety"]

  /api/sessions:
    post:
      tags: [Sessions]
      summary: Log a completed session
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [routineTitle, durationMin]
              properties:
                routineTitle: { type: string, example: "15-min Stress Relief Sequence" }
                durationMin: { type: integer, example: 15 }
                accuracy: { type: integer, minimum: 0, maximum: 100, example: 78 }
                calories: { type: integer, example: 62 }
                posesCompleted: { type: integer, example: 8 }
                targetCategories:
                  type: array
                  items: { type: string }
                  example: ["stress_relief", "back_pain"]
                fitnessLevel: { type: string, example: beginner }
                poseResults:
                  type: array
                  items:
                    type: object
                    properties:
                      poseId: { type: string }
                      poseName: { type: string }
                      accuracy: { type: integer }
                      durationSec: { type: integer }
      responses:
        "201":
          description: Session logged
          content:
            application/json:
              example:
                session:
                  _id: 60b8c3d4e5f6a7b8c9d0e1f2
                  userId: 60a7b2c3d4e5f6a7b8c9d0e1
                  routineTitle: 15-min Stress Relief Sequence
                  durationMin: 15
                  accuracy: 78
                  calories: 62
                  completedAt: "2026-06-22T14:30:00Z"

    get:
      tags: [Sessions]
      summary: Get session history (paginated)
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, default: 20 }
      responses:
        "200":
          description: Session list
          content:
            application/json:
              example:
                sessions: []
                page: 1
                limit: 20
                total: 47
                pages: 3

  /api/users/profile:
    patch:
      tags: [Users]
      summary: Update user profile
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            example:
              name: Shiva Kumar
              profile:
                weight: 70
                fitnessLevel: intermediate
      responses:
        "200":
          description: Profile updated

  /api/users/leaderboard:
    get:
      tags: [Users]
      summary: Top 10 users by session count (anonymous)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Leaderboard
          content:
            application/json:
              example:
                leaderboard:
                  - name: Priya Sharma
                    stats:
                      totalSessions: 42
                      totalMinutes: 630
                      avgAccuracy: 81

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
